[package]
name = "CatTrim"
version = "1.0.0"
edition = "2024"

[build-dependencies]
embed-resource = "3.0.11"
thunk-rs = "0.3.5"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
walkdir = "2.5.0"
anyhow = "1.0.104"
rayon = "1.11.0"
sha1 = "0.10.6"
sha2 = "0.10.9"
windows = { version = "0.62.2", features = [] }
